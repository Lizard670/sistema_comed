{% load static %}

<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="" />
        <meta name="author" content="" />
        <title>Dashboard - CoMed</title>
        <link href="https://cdn.jsdelivr.net/npm/simple-datatables@7.1.2/dist/style.min.css" rel="stylesheet" />
        <link href="{% static 'css/styles.css'%}" rel="stylesheet" />
        <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
    
        <script src="https://unpkg.com/js-year-calendar@latest/dist/js-year-calendar.min.js"></script>
        <link rel="stylesheet" type="text/css" href="https://unpkg.com/js-year-calendar@latest/dist/js-year-calendar.min.css" />
        <script src="https://unpkg.com/js-year-calendar@latest/locales/js-year-calendar.pt.js"></script>

        <link href="https://cdn.jsdelivr.net/npm/simple-datatables@10/dist/style.css" rel="stylesheet" type="text/css">
        <style>
            .form-select, .datatable-selector {
                background-image:none;
            }
        </style>
    </head>
    <body class="sb-nav-fixed">
        <nav class="sb-topnav navbar navbar-expand navbar-dark bg-dark">
            {% include 'topnav.html'%}
        </nav>
        <div id="layoutSidenav">
            <div id="layoutSidenav_nav">
                {% include 'sidenav.html'%}
            </div>
            <div id="layoutSidenav_content">
                <main>
                    <div class="container-fluid px-4">
                        <h1 class="mt-4">Dashboard</h1>
                        <ol class="breadcrumb mb-4">
                            <li class="breadcrumb-item active">Gráficos</li>
                        </ol>
                        <div class="row">
                            <div class="col-xl-6">
                                <div class="card mb-4">
                                    <div class="card-header">
                                        <i class="fas fa-chart-bar me-1"></i>
                                        Consultas
                                    </div>
                                    <div class="card-body">
                                        <div class="row align-items-center justify-content-end">
                                            <div class="col-3">
                                                <input id="anoGrafico" class="form-control" type="number" min="1901" max="9999"/>
                                            </div>
                                            <div class="col-1">
                                                <button id="btnAtualizarGrafico" class="btn btn-primary">
                                                    <i class="fa-solid fa-arrows-rotate"></i>
                                                </button>
                                            </div>
                                            <div class="col-1"></div>
                                        </div>
                                        <canvas id="graficoConsultas" width="100%" height="40"></canvas>
                                    </div>
                                </div>
                            </div>
                            <div class="col-xl-6">
                                <div class="card mb-4">
                                    <div class="card-body">
                                        <div class="calendario"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="card mb-4">
                            <div class="card-header">
                                <i class="fas fa-table me-1"></i>
                                Prontuários
                            </div>
                            <div class="card-body">
                                <table id="tabelaProntuarios" >
                                    <thead>
                                        <tr>
                                            <th>Nome</th>
                                            <th>Matrícula</th>
                                            <th>Data</th>
                                            <th></th>
                                        </tr>
                                    </thead>
                                </table>
                            </div>
                        </div>
                    </div>
                </main>
                
                {% include 'rodape.html'%}
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
        <script src="{% static 'js/scripts.js'%}"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.8.0/Chart.min.js" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/simple-datatables@10" type="text/javascript"></script>
        <script src="{% static 'js/tabela-prontuarios.js'%}"></script>
        <script>var prontuarios = {}; var alunos = {};</script>
        <script src="{% static 'js/grafico-consultas.js'%}"></script>
        <script>
            fetch("{% url 'api-prontuarios-list' %}")
            .then(response => response.json())
            .then(data => {
                for (const prontuario of data) {
                    data_consulta = new Date(prontuario["data"]);
                    const ano = data_consulta.getFullYear();
                    const mes = data_consulta.getMonth();
                    const dia = data_consulta.getDate();
                    

                    // Cria o ano se ainda não tinha sido criado
                    if (!Object.hasOwn(prontuarios, ano)) {
                        prontuarios[ano] = [{}, {}, {}, {}, {}, {}, {}, {}, {}, {}, {}, {}];
                    }
                    // Cria o dia se ainda não tinha sido criado
                    if (!Object.hasOwn(prontuarios[ano][mes], dia)) {
                        prontuarios[ano][mes][dia] = [];
                    }

                    prontuarios[ano][mes][dia].push(prontuario);
                }
                atualizarGraficoConsultas(graficoConsultas);
            })
            .catch(error => console.error('Erro ao pegar dados dos prontuários:', error));

            fetch("{% url 'api-alunos-list' %}")
            .then(response => response.json())
            .then(data => {
                for (aluno of data) {
                    alunos[aluno["id"]] = {
                        "matricula": aluno["matricula"],
                        "nome": aluno["nome"],
                        "nome_responsavel": aluno["nome_responsavel"],
                        "turma": aluno["turma"]
                    }
                }
                criarTabela(prontuarios, alunos, "{% url 'prontuario' pk=670670 %}");
            })
            .catch(error => console.error('Erro ao pegar dados dos alunos:', error));
        </script>
        
        <script>
            const calendario = new Calendar('.calendario');
            calendario.setLanguage('pt');
            calendario.setNumberMonthsDisplayed(1);
        </script>
    </body>
</html>
