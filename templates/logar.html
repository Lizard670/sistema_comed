{% load static %}
{% load crispy_forms_tags %}
<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="" />
        <meta name="author" content="" />
        <title>Logar - CoMed</title>
        <link href="{% static 'css/styles.css'%}" rel="stylesheet" />
        <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
    </head>
    <body >
        <div id="layoutAuthentication vw-100">
            <div id="layoutAuthentication_content">
                <main>
                    <div class="row align-items-center">
                        <div class="container col-md-6 flex-grow-1 bg-primary vh-100 overflow-scroll">
                            <div class="row justify-content-center">
                                <div class="col-lg-11">
                                    <div class="row-md-1 w-25 card start-50 translate-middle-x">
                                        <img src="{% static 'assets/img/Logo IFBA.svg'%}" 
                                            class="img-fluid" 
                                            alt="Logo IFBA">
                                    </div>
                                    <div class="row-md-10 card shadow-lg border-0 rounded-lg mt-5">
                                        <div class="card-body">
                                            <form>
                                                {% csrf_token %}
                                                {% crispy form form.helper %}
                                            </form>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <div class="col-md-6 d-none d-lg-block position-relative">
                            <div class="row-md-2 w-50 position-absolute top-50 start-50 translate-middle">
                                <img src="{% static 'assets/img/Logo CoMed.png'%}" 
                                     class="img-fluid" 
                                     alt="Logo CoMed">
                            </div>
                        </div>
                    </div>
                </main>
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
        <script src="{% static 'js/scripts.js'%}"></script>
    </body>
</html>
