{% load static %}
{% load crispy_forms_tags %}

<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="" />
        <meta name="author" content="" />
        <title>Relatórios - CoMed</title>
        <link href="{% static 'css/styles.css'%}" rel="stylesheet" />
        <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    </head>
    <body class="sb-nav-fixed">
        <nav class="sb-topnav navbar navbar-expand navbar-dark bg-dark">
            {% include 'topnav.html'%}
        </nav>
        <div id="layoutSidenav">
            <div id="layoutSidenav_nav">
                {% include 'sidenav.html'%}
            </div>
            <div id="layoutSidenav_content">
                <main>
                    <div class="container-fluid px-4">
                        <h1 class="mt-4">Relatórios dos prontuários</h1>
                        <form action="{% url 'relatorios' %}" method="post">
                            {% csrf_token %}
                            {% crispy form form.helper %}
                        </form>
                    </div>
                </main>
                
                {% include 'rodape.html'%}
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
        <script src="{% static 'js/scripts.js'%}"></script>
        <script src="{% static 'js/gerar-relatorio.js'%}"></script>

        <script>
            var prontuarios = []; 
            var alunos = {};
            var turmas = {};
            var cursos = {};

            fetch("{% url 'api-prontuarios-list' %}")
            .then(response => response.json())
            .then(data => {
                for (const prontuario of data) {
                    prontuario["data"] = new Date(prontuario["data"]);
                    prontuarios.push(prontuario);
                }
            })
            .catch(error => console.error('Erro ao pegar dados dos prontuários:', error));

            fetch("{% url 'api-alunos-list' %}")
            .then(response => response.json())
            .then(data => {
                for (aluno of data) {
                    alunos[aluno["id"]] = {
                        "matricula": aluno["matricula"],
                        "nome": aluno["nome"],
                        "nome_responsavel": aluno["nome_responsavel"],
                        "turma": aluno["turma"]
                    }
                }
            })
            .catch(error => console.error('Erro ao pegar dados dos alunos:', error));

            fetch("{% url 'api-turmas-list' %}")
            .then(response => response.json())
            .then(data => {
                for (const turma of data) {
                    turmas[turma["id"]] = {
                        "nome": turma["nome"],
                        "curso": turma["curso"],
                        "ano": turma["ano"]
                    }
                }
            })
            .catch(error => console.error('Erro ao pegar dados das turmas:', error));

            fetch("{% url 'api-cursos-list' %}")
            .then(response => response.json())
            .then(data => {
                for (const curso of data) {
                    cursos[curso["id"]] = curso["nome"]
                }
            })
            .catch(error => console.error('Erro ao pegar dados das turmas:', error));

            // Pega input de checkbox ou radiobuttons
            function pegarValoresSelect(id, isInt=false) {
                let valores = [];
                let i = 0;
                while (true) {
                    try {
                        if (document.getElementById(id+i).checked) {
                            if (isInt) {valores.push(parseInt(document.getElementById(id+i).value));}
                            else {valores.push(document.getElementById(id+i).value);}
                        }
                        i++;
                    } catch (e) {
                        if (e instanceof TypeError) {break;}
                        else {throw e;}
                    }
                }
                return valores;
            }

            function DateParaString(data) {
                // Corrige a data por conta do fuso horario
                // Se em algum momento o Brasil voltar a ter horário de verão, um bug vai ser introduzido
                data = new Date(data.getTime() + (3*60*60*1000));
                return (""+data.getDate()+"/"+(data.getMonth()+1)+"/"+data.getFullYear())
            }

            // Listener do botão do crispy form
            const btnCrispy = document.querySelector('input[name="declaracao"], button[name="declaracao"]');
            if (btnCrispy) {
                btnCrispy.addEventListener('click', async function () {


                    const data_inicio = new Date(document.getElementById('id_data_inicio').value);
                    const data_fim = new Date(document.getElementById('id_data_fim').value);
                    
                    let turma_filtro = parseInt(document.getElementById('id_turma').value);
                    let cursos_filtro = pegarValoresSelect("id_curso_", isInt=true);
                    let anos_filtro = pegarValoresSelect("id_ano_", isInt=true);
                    
                    const escrever_opcoes = document.getElementById('id_escrever_opcoes').checked;
                    const agrupar = pegarValoresSelect("id_agrupar_").pop() || "nenhum";


                    const btn = this;
                    btn.disabled = true;
                    btn.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i> Gerando...';

                    let prontuarios_filtrados = []
                    let total = 0;
                    for (const prontuario of prontuarios) {
                        if (prontuario["data"] < data_inicio) {continue;}
                        if (prontuario["data"] > data_fim) {continue;}
                        const id_turma = alunos[prontuario["aluno"]]["turma"];
                        if (turma_filtro && id_turma != turma_filtro) {continue;}
                        if (!(anos_filtro.length == 0 || anos_filtro.includes(turmas[id_turma]["ano"]))) {continue;}
                        if (!(cursos_filtro.length == 0 || cursos_filtro.includes(turmas[id_turma]["curso"]))) {continue;}

                        total++;
                        switch (agrupar) {
                            case "nenhum":
                                prontuarios_filtrados.push({
                                    "Status": prontuario["status"], 
                                    "Data": DateParaString(prontuario["data"]), 
                                    "Aluno": alunos[prontuario["aluno"]]["nome"],
                                    "Matrícula": alunos[prontuario["aluno"]]["matricula"],
                                    "Turma": turmas[alunos[prontuario["aluno"]]["turma"]]["nome"],
                                });
                        }
                    } 

                    let data = {
                        "prontuarios": prontuarios_filtrados,
                        "cabecalhos": ["Aluno", "Matrícula", "Status", "Data", "Turma"],
                        "total_prontuarios": total
                    }

                    let opcoes = {
                        "data_inicio": data_inicio,
                        "data_fim": data_fim,
                        "escrever_opcoes": escrever_opcoes,
                        "agrupar": agrupar
                    }

                    gerarPdfRelatorio(data, opcoes);

                    btn.disabled = false;
                    btn.innerHTML = 'Gerar relatório';
            });}
        </script>
    </body>
</html>
