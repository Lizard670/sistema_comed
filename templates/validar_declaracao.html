{% load static %}

<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="" />
        <meta name="author" content="" />
        <title>Validar Declaração - CoMed</title>
        <link href="{% static 'css/styles.css'%}" rel="stylesheet" />
        <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
    </head>
    <body>
        <div id="layoutAuthentication vw-100">
            <div id="layoutAuthentication_content">
                <main>
                    <div class="row align-items-center">
                        <div class="container col-md-6 flex-grow-1 bg-primary vh-100 overflow-scroll">
                            <div class="row justify-content-center">
                                <div class="col-lg-11">
                                    <div class="row-md-1 w-25 card start-50 translate-middle-x">
                                        <img src="{% static 'assets/img/Logo IFBA.svg'%}" 
                                            class="img-fluid" 
                                            alt="Logo IFBA">
                                    </div>
                                    <div class="row-md-10 card shadow-lg border-0 rounded-lg mt-5">
                                        <div class="card-header">
                                            <h3 class="text-center font-weight-light my-2">
                                                <i class="fas fa-file-circle-check me-2"></i>
                                                Validar Declaração
                                            </h3>
                                        </div>
                                        <div class="card-body">
                                            <p class="text-muted text-center mb-4">
                                                Insira o código da declaração para verificar sua autenticidade.
                                            </p>

                                            <!-- Formulário de validação -->
                                            <div class="mb-3">
                                                <label class="form-label" for="inputCodigo">
                                                    Código da Declaração
                                                </label>
                                                <div class="input-group">
                                                    <input
                                                        class="form-control"
                                                        id="inputCodigo"
                                                        type="text"
                                                        placeholder="Ex: CoMed-23A231CF5923E874AABBCCDD11223344"
                                                        value="{{ codigo|default:'' }}"
                                                    />
                                                    <button
                                                        class="btn btn-primary"
                                                        type="button"
                                                        id="btnValidar"
                                                        onclick="validarDeclaracao()"
                                                    >
                                                        <i class="fas fa-search me-1"></i>
                                                        Validar
                                                    </button>
                                                </div>
                                            </div>

                                            <!-- Resultado da validação (oculto por padrão) -->
                                            <div id="resultadoValidacao" class="mt-4" style="display: none;">
                                            </div>
                                        </div>
                                        <div class="card-footer text-center py-3">
                                            <a href="{% url 'index' %}">
                                                <i class="fas fa-arrow-left me-1"></i>
                                                Voltar para página inicial
                                            </a>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="col-md-6 d-none d-lg-block position-relative">
                            <div class="row-md-2 w-50 position-absolute top-50 start-50 translate-middle">
                                <img src="{% static 'assets/img/Logo CoMed.png'%}" 
                                     class="img-fluid" 
                                     alt="Logo CoMed">
                            </div>
                        </div>
                    </div>
                </main>
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
        <script src="{% static 'js/scripts.js'%}"></script>

        <script>
            /**
             * Faz a requisição ao endpoint público de validação e exibe o resultado.
             * O endpoint retorna apenas {"valido": true} ou {"valido": false}.
             */
            function validarDeclaracao() {
                const codigo = document.getElementById("inputCodigo").value.trim();
                const resultado = document.getElementById("resultadoValidacao");

                // Não buscar se o campo estiver vazio
                if (!codigo) {
                    resultado.style.display = "block";
                    resultado.innerHTML = `
                        <div class="alert alert-warning text-center" role="alert">
                            <i class="fas fa-exclamation-triangle me-2"></i>
                            Por favor, insira um código para validar.
                        </div>
                    `;
                    return;
                }

                // Desabilitar botão durante a requisição
                const btnValidar = document.getElementById("btnValidar");
                btnValidar.disabled = true;
                btnValidar.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i> Validando...';

                fetch(`/api/validar/${encodeURIComponent(codigo)}/`)
                    .then(response => response.json())
                    .then(data => {
                        resultado.style.display = "block";
                        if (data.valido) {
                            const dataAtendimento = data.data_atendimento
                                ? new Date(`${data.data_atendimento}T00:00:00`).toLocaleDateString('pt-BR')
                                : '—';
                            const horarioEntrada = data.horario_entrada
                                ? data.horario_entrada.slice(0, 5)
                                : '—';
                            const horarioSaida = data.horario_saida
                                ? data.horario_saida.slice(0, 5)
                                : '—';
                            resultado.innerHTML = `
                                <div class="alert alert-success text-center" role="alert">
                                    <i class="fas fa-check-circle me-2"></i>
                                    <strong>Declaração válida!</strong><br>
                                    Este código corresponde a uma declaração legítima emitida pelo CoMed.
                                    <hr>
                                    <div class="row text-start small g-2">
                                        <div class="col-md-3"><strong>Matrícula:</strong> ${data.matricula || '—'}</div>
                                        <div class="col-md-3"><strong>Data:</strong> ${dataAtendimento}</div>
                                        <div class="col-md-3"><strong>Entrada:</strong> ${horarioEntrada}</div>
                                        <div class="col-md-3"><strong>Saída:</strong> ${horarioSaida}</div>
                                    </div>
                                </div>
                            `;
                        } else {
                            resultado.innerHTML = `
                                <div class="alert alert-danger text-center" role="alert">
                                    <i class="fas fa-times-circle me-2"></i>
                                    <strong>Declaração não encontrada.</strong><br>
                                    O código informado não corresponde a nenhuma declaração registrada.
                                </div>
                            `;
                        }
                    })
                    .catch(() => {
                        resultado.style.display = "block";
                        resultado.innerHTML = `
                            <div class="alert alert-danger text-center" role="alert">
                                <i class="fas fa-exclamation-circle me-2"></i>
                                Erro ao conectar com o servidor. Tente novamente mais tarde.
                            </div>
                        `;
                    })
                    .finally(() => {
                        btnValidar.disabled = false;
                        btnValidar.innerHTML = '<i class="fas fa-search me-1"></i> Validar';
                    });
            }

            // Permitir validação ao pressionar Enter no campo de código
            document.getElementById("inputCodigo").addEventListener("keypress", function (event) {
                if (event.key === "Enter") {
                    validarDeclaracao();
                }
            });

            // Se o código foi passado pela URL, validar automaticamente ao carregar a página
            window.addEventListener("DOMContentLoaded", function () {
                const codigoInicial = document.getElementById("inputCodigo").value.trim();
                if (codigoInicial) {
                    validarDeclaracao();
                }
            });
        </script>
    </body>
</html>
