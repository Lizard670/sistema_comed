{% load static %}
{% load crispy_forms_tags %}
<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="" />
        <meta name="author" content="" />
        <title>Prontuário - CoMed</title>
        <link href="{% static 'css/styles.css'%}" rel="stylesheet" />
        <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
        <!-- jsPDF: geração de PDF no browser -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
        <!-- QRious: geração síncrona de QR Codes -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
        <style>
            /* Customização do botão do Crispy Form */
            input[name="declaracao"],
            button[name="declaracao"] {
                background-color: #187D75 !important;
                color: white !important;
                border: none !important;
                padding: 8px 20px !important;
                border-radius: 6px !important;
                font-weight: 600 !important;
                transition: background-color 0.2s ease !important;
                box-shadow: 0 2px 4px rgba(24, 125, 117, 0.15) !important;
            }

            input[name="declaracao"]:hover,
            button[name="declaracao"]:hover {
                background-color: #13635d !important;
            }
        </style>
    </head>

    <body class="sb-nav-fixed">
        <nav class="sb-topnav navbar navbar-expand navbar-dark bg-dark">
            {% include 'topnav.html'%}
        </nav>
        <div id="layoutSidenav">
            <div id="layoutSidenav_nav">
                {% include 'sidenav.html'%}
            </div>
            <div id="layoutSidenav_content">
                <main>
                    <div class="container-fluid px-4">
                        <h1 class="mt-4">Prontuário</h1>

                        <form action="{% url 'prontuario' pk=pk %}" method="post">
                            {% csrf_token %}
                            {% crispy form form.helper %}
                        </form>
                        
                        <div id="declErro" class="alert alert-danger d-none" role="alert"></div>
                    </div>
                </main>

                {% include 'rodape.html'%}
            </div>
        </div>

    

    <!-- Elementos invisíveis para carregar as imagens e convertê-las para Base64 no jsPDF -->
    <img id="imgLogoIfba" src="{% static 'assets/img/Logo IFBA.svg' %}" style="display: none;" />
    <img id="imgLogoComed" src="{% static 'assets/img/Logo CoMed.png' %}" style="display: none;" />

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>
    <script src="{% static 'js/scripts.js'%}"></script>

    <script>
        // Se foi passado, exibe erro
        let err = "{{err|default:'0'}}" 
        if (err !== "0") {
            const erroDiv = document.getElementById('declErro');
            erroDiv.textContent = "O user logado não possui usuário associado, entre em contato com o suporte para corrigir.";
            erroDiv.classList.remove('d-none');
        }

        // Função auxiliar para converter um elemento <img> em Base64 PNG
        function obterBase64DaImagem(imgElement) {
            try {
                const canvas = document.createElement('canvas');
                canvas.width = imgElement.naturalWidth || imgElement.width;
                canvas.height = imgElement.naturalHeight || imgElement.height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(imgElement, 0, 0);
                return canvas.toDataURL('image/png');
            } catch (e) {
                console.error("Erro ao converter imagem para base64:", e);
                return null;
            }
        }

        // Geração do PDF com jsPDF
        function gerarPdfDeclaracao(data) {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ unit: 'mm', format: 'a4' });

            const aluno = (data.prontuario_detalhes || {}).aluno || {};
            const pront = data.prontuario_detalhes || {};
            const codigo = data.codigo || '';
            const emissao = data.data_horario_emissao
                ? new Date(data.data_horario_emissao).toLocaleString('pt-BR')
                : new Date().toLocaleString('pt-BR');
            const dataAtend = pront.data
                ? new Date(pront.data + 'T00:00:00').toLocaleDateString('pt-BR')
                : '—';

            const pageW = 210;
            const margin = 20;
            const cW = pageW - margin * 2;

            // Cabeçalho colorido
            doc.setFillColor(24, 125, 117);
            doc.rect(0, 0, pageW, 38, 'F');

            // Logo do CoMed e IFBA no cabeçalho
            const imgIfba = document.getElementById('imgLogoIfba');
            const imgComed = document.getElementById('imgLogoComed');
            const base64Ifba = obterBase64DaImagem(imgIfba);
            const base64Comed = obterBase64DaImagem(imgComed);
            
            let currentX = 8; // Inicia mais à esquerda (margem menor que a do conteúdo para aproveitar o espaço)

            if (base64Comed) {
                // Desenha primeiro o logo do CoMed
                doc.addImage(base64Comed, 'PNG', currentX, 8, 26, 21);
                currentX += 29; // Espaço do logo CoMed + gap
            }

            if (base64Ifba) {
                // Desenha o logo do IFBA
                doc.addImage(base64Ifba, 'PNG', currentX, 7, 18, 24);
                currentX += 22; // Espaço do logo IFBA + gap
            }

            doc.setTextColor(255, 255, 255);
            doc.setFont('helvetica', 'bold');
            doc.setFontSize(16);
            doc.text('IFBA - Campus Porto Seguro', currentX, 17);
            doc.setFontSize(10);
            doc.setFont('helvetica', 'normal');
            doc.text('CoMed - Coordenação Médica', currentX, 25);

            // Título
            doc.setTextColor(24, 125, 117);
            doc.setFont('helvetica', 'bold');
            doc.setFontSize(16);
            doc.text('DECLARAÇÃO MÉDICA', pageW / 2, 52, { align: 'center' });
            doc.setDrawColor(24, 125, 117);
            doc.setLineWidth(0.5);
            doc.line(margin, 56, pageW - margin, 56);

            // Dados do estudante
            doc.setTextColor(40, 40, 40);
            doc.setFont('helvetica', 'bold');
            doc.setFontSize(11);
            doc.text('Dados do Estudante', margin, 65);

            const campos = [
                ['Nome:', aluno.nome || '—'],
                ['Matrícula:', aluno.matricula || '—'],
                ['Turma:', aluno.turma_nome || '—'],
                ['Curso:', aluno.curso_nome || '—'],
                ['Data do Atendimento:', dataAtend],
            ];

            doc.setFontSize(10);
            let y = 73;
            campos.forEach(([label, valor]) => {
                doc.setFont('helvetica', 'bold');
                doc.text(label, margin, y);
                doc.setFont('helvetica', 'normal');
                doc.text(String(valor), margin + 55, y);
                y += 7;
            });

            // Descrição
            y += 4;
            doc.setFont('helvetica', 'bold');
            doc.setFontSize(11);
            doc.text('Descrição', margin, y);
            y += 7;
            doc.setFont('helvetica', 'normal');
            doc.setFontSize(10);
            const linhas = doc.splitTextToSize(data.descricao || '', cW);
            doc.text(linhas, margin, y);
            y += linhas.length * 6 + 12;

            // Caixa do código de validação
            doc.setFillColor(237, 248, 246);
            doc.setDrawColor(24, 125, 117);
            doc.setLineWidth(0.8);
            doc.roundedRect(margin, y, cW, 26, 3, 3, 'FD');
            doc.setTextColor(24, 125, 117);
            doc.setFont('helvetica', 'bold');
            doc.setFontSize(8);
            doc.text('CÓDIGO DE VALIDAÇÃO', pageW / 2, y + 8, { align: 'center' });
            doc.setFont('courier', 'bold');
            doc.setFontSize(15);
            doc.text(codigo, pageW / 2, y + 19, { align: 'center' });
            y += 33;

            // Posiciona data de emissão e QR Code de forma absoluta na base do PDF
            const footerY = 242;

            doc.setTextColor(120, 120, 120);
            doc.setFont('helvetica', 'normal');
            doc.setFontSize(9);
            doc.text(`Emitido em: ${emissao}`, margin, footerY + 10);

            // Gerando e desenhando o QR Code
            const urlValidacao = `${window.location.origin}/validar/${codigo}/`;
            const canvas = document.createElement('canvas');
            canvas.width = 250;
            canvas.height = 250;
            const qr = new QRious({
                element: canvas,
                value: urlValidacao,
                size: 250,
                level: 'H'
            });
            const qrImageBase64 = canvas.toDataURL('image/jpeg');

            // Desenha o QR Code e instruções alinhados à direita
            doc.addImage(qrImageBase64, 'JPEG', pageW - margin - 26, footerY - 14, 26, 26, undefined, 'FAST');
            doc.setFontSize(7);
            doc.text('Aponte a câmera para validar', pageW - margin - 28, footerY + 16);

            // Rodapé
            doc.setFillColor(24, 125, 117);
            doc.rect(0, 282, pageW, 15, 'F');
            doc.setTextColor(255, 255, 255);
            doc.setFontSize(8);
            doc.text(
                `IFBA - Campus Porto Seguro | Valide em: ${urlValidacao}`,
                pageW / 2, 291, { align: 'center' }
            );

            doc.save(`declaracao_${codigo}.pdf`);
        }

        // Listener do botão 'Gerar declaração' do crispy form
        const btnCrispy = document.querySelector('input[name="declaracao"], button[name="declaracao"]');
        if (btnCrispy) {
            // Impede o submit acidental
            btnCrispy.addEventListener('click', async function () {
                const prontuarioId = "{{pk|default:'0'}}";
                const erroDiv = document.getElementById('declErro');

                erroDiv.classList.add('d-none');
                this.disabled = true;

                try {
                    const resp = await fetch('/api/declaracao/'+prontuarioId+'/');

                    if (!resp.ok) {
                        // A resposta pode ser HTML (ex: página de login 403) — não tenta JSON direto
                        let errMsg = `Erro HTTP ${resp.status}`;
                        const contentType = resp.headers.get('content-type') || '';
                        if (resp.status === 403) {
                            errMsg = 'Acesso negado (403). Verifique se você está autenticado.';
                        } else if (resp.status === 404) {;
                            errMsg = 'Declaração não encontrada (404). Lembre-se de salvar a declaração antes de gerar o pdf.';
                        } else if (contentType.includes('application/json')) {
                            const err = await resp.json();
                            errMsg = JSON.stringify(err);
                        } else {
                            errMsg = `Erro HTTP ${resp.status}. Verifique o console para mais detalhes.`;
                            console.error('Resposta inesperada:', await resp.text());
                        }
                        throw new Error(errMsg);
                    }

                    const data = await resp.json();

                    // Gera e dispara o download do PDF
                    gerarPdfDeclaracao(data);

                } catch (e) {
                    erroDiv.textContent = 'Erro ao gerar pdf: ' + e.message;
                    erroDiv.classList.remove('d-none');
                } finally {
                    this.disabled = false;
                }
            });
        }
    </script>
</body>
</html>
